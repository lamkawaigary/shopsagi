<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>離線 - Open Shops</title>
  <style>
    :root {
      --color-primary: #FF6B35;
      --color-surface: #FFFFFF;
      --color-on-surface: #1A1A1A;
      --color-on-surface-variant: #666666;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-surface);
      color: var(--color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    
    .icon svg {
      width: 40px;
      height: 40px;
      fill: white;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--color-on-surface);
      margin-bottom: 12px;
    }
    
    p {
      font-size: 16px;
      color: var(--color-on-surface-variant);
      margin-bottom: 24px;
      max-width: 300px;
      line-height: 1.5;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--color-primary);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    .btn:hover {
      opacity: 0.9;
    }
    
    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    
    .cached-pages {
      margin-top: 32px;
      padding: 16px;
      background: #F5F5F5;
      border-radius: 12px;
      width: 100%;
      max-width: 300px;
    }
    
    .cached-pages h2 {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-on-surface);
      margin-bottom: 12px;
    }
    
    .cached-pages a {
      display: block;
      padding: 8px 12px;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 14px;
      border-radius: 8px;
      margin-bottom: 4px;
    }
    
    .cached-pages a:hover {
      background: #EEEEEE;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24">
      <path d="M23 18h-1v-4h-2v4H8v-4H7c-1.1 0-2-.9-2-2v-3H2v3c0 1.1.9 2 2 2h1v1c0 1.66 1.34 3 3 3s3-1.34 3-3v-1h2v1c0 1.66 1.34 3 3 3s3-1.34 3-3v-1h1c1.1 0 2-.9 2-2v-3h-2v3c0 1.1-.9 2-2 2zm-6 0h-4v-4h4v4zm6-6h-1v-1h-1v1h-2v-1h-1v1H9v-1H8v1H7v-2c0-1.1.9-2 2-2h6c1.1 0 2 .9 2 2v2z"/>
    </svg>
  </div>
  
  <h1>目前離線</h1>
  <p>請檢查您的網絡連接，或稍後再試。您仍可瀏覽之前訪問過的頁面。</p>
  
  <button class="btn" onclick="window.location.reload()">
    <svg viewBox="0 0 24 24">
      <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
    重新嘗試
  </button>
  
  <div class="cached-pages">
    <h2>最近瀏覽</h2>
    <a href="/customer">開始購物</a>
    <a href="/customer/orders">我的訂單</a>
    <a href="/customer/profile">個人資料</a>
  </div>
</body>
</html>
